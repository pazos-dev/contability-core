name: check

# The same command the project documents in AGENTS.md and README.md. It runs the structure validator, the
# type check, the build and the suite, in that order: the suite consumes `dist/`, so a build has to happen
# first. Nothing here is invented for CI — `pnpm check` is the command a human runs locally.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The durable adapters prove their guarantees against a real engine, because an in-memory store cannot
    # demonstrate atomicity, isolation or an exclusion constraint. A service container keeps the suite a
    # single command: `pnpm check` is still everything a human runs locally.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONTABILITY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          # `engines.node` requires >=24, which is also what the suite runs on locally.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
